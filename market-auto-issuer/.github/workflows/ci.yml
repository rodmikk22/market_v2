name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: market-auto-issuer

jobs:
  # ─────────────────────────── Lint ──────────────────────────────────────────
  lint:
    name: Lint (flake8 + isort + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint deps
        run: pip install black isort flake8

      - name: black check
        run: black --check --diff app/ tests/

      - name: isort check
        run: isort --check-only --diff app/ tests/

      - name: flake8 check
        run: flake8 app/ tests/ --max-line-length=100 --extend-ignore=E203,W503

  # ─────────────────────────── Tests ─────────────────────────────────────────
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: sqlite:///:memory:
      REDIS_URL: redis://localhost:6379/0
      MARKET_API_TOKEN: ACMA:test_token
      MARKET_CAMPAIGN_ID: "12345"
      MARKET_BUSINESS_ID: "67890"
      DELIVERY_MODE: dry_run

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────── Docker build ──────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────── Deploy (optional) ─────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Set DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY secrets to enable auto-deploy
    environment: production

    steps:
      - name: Check deploy secrets
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::notice::DEPLOY_HOST secret not set — skipping deploy step"
          fi

      - name: Deploy via SSH
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /root/market-auto-issuer
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
